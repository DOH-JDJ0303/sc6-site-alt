<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 262" role="img" aria-labelledby="de-novo-assembly-title de-novo-assembly-desc" class="diagram-svg">
  <title id="de-novo-assembly-title">De novo assembly: overlapping reads are joined into longer contigs without using a reference genome.</title>
  <desc id="de-novo-assembly-desc">Short reads with no reference are compared to find shared sequence at their ends. Overlapping reads are joined into a longer contig. An assembly usually yields several contigs, which must be ordered, oriented, and trimmed before alignment.</desc>
