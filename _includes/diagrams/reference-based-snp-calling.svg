<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-labelledby="reference-based-snp-calling-title reference-based-snp-calling-desc" class="diagram-svg">
  <title id="reference-based-snp-calling-title">Reference-based SNP calling: each sample's SNPs are called against a reference, positions missing in any sample are dropped, and the remaining variable positions form the SNP alignment.</title>
  <desc id="reference-based-snp-calling-desc">Three samples are compared with a 16-base reference. Positions where any sample has no coverage are excluded from the core, which also drops a SNP that only one sample carried there. The three variable positions left in the core form the SNP alignment.</desc>
  <text x="20" y="26" font-family="Raleway, Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#055A5E" text-anchor="start">1. Call SNPs in each sample against the reference</text>
