<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-labelledby="reference-based-consensus-calling-title reference-based-consensus-calling-desc" class="diagram-svg">
  <title id="reference-based-consensus-calling-title">Reference-based consensus calling: reads are stacked on a reference and the majority base at each position becomes the sample's consensus.</title>
  <desc id="reference-based-consensus-calling-desc">Four reads are mapped to a 16-base reference. At one position three of four reads carry C instead of T, so the consensus calls C. Reads share a one-base deletion, which the consensus keeps. The last two positions have no coverage and are written as N.</desc>
