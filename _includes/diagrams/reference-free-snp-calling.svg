<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" role="img" aria-labelledby="reference-free-snp-calling-title reference-free-snp-calling-desc" class="diagram-svg">
  <title id="reference-free-snp-calling-title">Reference-free SNP calling: split k-mers whose flanking sequence matches across samples are grouped, and the middle base of each becomes one column of the SNP alignment.</title>
  <desc id="reference-free-snp-calling-desc">Each sample is broken into split k-mers: two flanks that must match exactly and a middle base that may differ. Split k-mers with the same flanks are grouped across samples, and their middle bases become the columns of the SNP alignment, with no reference genome and no genome positions.</desc>
  <text x="20" y="26" font-family="Raleway, Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#055A5E" text-anchor="start">1. Match split k-mers across samples</text>
